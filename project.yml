name: Mandala
options:
  bundleIdPrefix: com.michellefitzpatrick
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_BUNDLE_IDENTIFIER: com.michellefitzpatrick.Mandala
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  Mandala:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Mandala
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: Mandala/Resources
    info:
      path: Mandala/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIAppFonts:
          - CormorantGaramond-Light.ttf
          - CormorantGaramond-LightItalic.ttf
          - DMSans-Light.ttf
          - DMSans-Regular.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarHidden: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michellefitzpatrick.Mandala
        SWIFT_STRICT_CONCURRENCY: targeted
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []
    scheme:
      testTargets: []
